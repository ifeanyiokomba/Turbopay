# TurboPay — Test Database (Docker PostgreSQL)
# =============================================
#
# Provides an isolated PostgreSQL instance for running DB-backed tests.
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d
#   DATABASE_URL_TEST="postgresql://test:test@localhost:5433/turbopay_test?schema=public" bun run test
#   docker compose -f docker-compose.test.yml down -v
#
# The database runs on port 5433 (not 5432) to avoid conflicts with any
# local PostgreSQL installation.

services:
  test-db:
    image: postgres:16-alpine
    container_name: turbopay-test-db
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: turbopay_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data  # RAM-backed for speed (data lost on restart)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d turbopay_test"]
      interval: 2s
      timeout: 5s
      retries: 5
