# ============================================================
# TurboPay — Kubernetes CronJob Definitions
# ============================================================
#
# These CronJobs call the TurboPay API routes on schedule.
# Each job sends an HTTP request to the cron endpoint with
# the x-cron-secret header for authentication.
#
# Prerequisites:
#   - TurboPay deployment running in the cluster
#   - CRON_SECRET environment variable configured
#   - Network policy allows CronJob pods to reach the TurboPay service
#
# Usage:
#   kubectl apply -f k8s/cronjobs/turbopay-cron.yaml
# ============================================================

---
# Outbox Publisher — every minute
apiVersion: batch/v1
kind: CronJob
metadata:
  name: turbopay-outbox-publisher
  namespace: turbopay
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 55
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cron
              image: curlimages/curl:latest
              command:
                - /bin/sh
                - -c
                - |
                  curl -sf -X POST \
                    -H "x-cron-secret: ${CRON_SECRET}" \
                    http://turbopay:3000/api/cron/outbox-publisher
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: turbopay-secrets
                      key: CRON_SECRET

