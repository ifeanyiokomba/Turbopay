services:
  - type: web
    name: turbopay-api
    runtime: node
    plan: starter
    rootDir: turbopay-complete-latest
    buildCommand: bun install --frozen-lockfile && bun run db:generate && bun run build
    startCommand: bun .next/standalone/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: TURBOPAY_PII_KEY
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        sync: false
