# Turbopay CI/CD pipeline.
#
# Triggers:
#   - pull_request: runs quality checks (lint, types, tests)
#   - push to main: lint + types + tests (Vercel auto-deploys via GitHub integration)

name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + Types + Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: turbopay-complete-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: turbopay
          POSTGRES_PASSWORD: turbopay
          POSTGRES_DB: turbopay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://turbopay:turbopay@localhost:5432/turbopay_test"
      DIRECT_URL: "postgresql://turbopay:turbopay@localhost:5432/turbopay_test"
      NODE_ENV: "test"
      JWT_SECRET: "test-secret-for-ci-only"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Prisma schema
        run: bunx prisma validate

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Run database migrations
        run: bunx prisma migrate dev --name ci --skip-generate

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Run tests
        run: bun run test
