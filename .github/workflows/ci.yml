# TurboPay CI/CD pipeline — production app (turbopay-complete-latest/)
#
# Triggers:
#   - pull_request: lint + types + tests (Vercel/Render auto-deploy via integrations)
#   - push to main: lint + types + tests
#
# NOTE: GitHub Actions ONLY reads workflows from `.github/workflows/` at the
# repository ROOT. This file is the single source of truth — the old nested
# workflow (turbopay-complete-latest/.github/workflows/ci.yml) is deleted so
# there is no duplicate/misconfigured pipeline.

name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + Types + Tests
    runs-on: ubuntu-latest

    # Every step below runs inside the Next.js app directory.
    defaults:
      run:
        working-directory: turbopay-complete-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: turbopay
          POSTGRES_PASSWORD: turbopay
          POSTGRES_DB: turbopay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://turbopay:turbopay@localhost:5432/turbopay_test"
      DIRECT_URL: "postgresql://turbopay:turbopay@localhost:5432/turbopay_test"
      NODE_ENV: "test"
      JWT_SECRET: "test-secret-for-ci-only"
      CRON_SECRET: "test-cron-secret-for-ci-only"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Prisma schema
        run: bunx prisma validate

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Apply database migrations
        run: bunx prisma migrate deploy

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Run tests
        run: bun run test

      - name: Production build
        # next.config.ts pins NODE_ENV=production + NEXT_BUILD during build, so
        # the shell's NODE_ENV value (if any) cannot break it, and build-time
        # secret validation is skipped (Vercel injects secrets at runtime).
        run: bun run build
